worker_processes auto;
events { worker_connections 1024; }

http {
  # Docker内蔵DNSで名前解決（起動順に依存しないよう変数経由で proxy_pass する）
  resolver 127.0.0.11 valid=10s;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    client_max_body_size 0;

    location = / { return 302 /redmine/; }

    # ---- Redmine: 自前のログイン画面で認証 ----
    location /redmine {
      set $up http://redmine:80;
      proxy_pass $up;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 認証サブリクエスト: Redmine REST API に Basic 認証をそのまま転送 ----
    location = /_auth {
      internal;
      # 変数経由の proxy_pass は URI を含めないと元リクエストの URI を送ってしまうため、URI まで書く。
      # 変数はサブリクエストと元リクエストで共有されるので、$up とは別名にする。
      set $auth_up http://redmine:80/redmine/users/current.json;
      proxy_pass $auth_up;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $http_host;
      proxy_set_header Authorization $http_authorization;
    }

    # ---- Jenkins: Redmine アカウントで Basic 認証 → ユーザー名をヘッダで渡す ----
    location /jenkins {
      auth_request /_auth;
      error_page 401 = @unauthorized;

      set $up http://jenkins:8080;
      proxy_pass $up;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # クライアントが偽装できないよう、必ず認証済みユーザー名で上書きする
      proxy_set_header X-Forwarded-User $remote_user;
      proxy_set_header Authorization "";
      proxy_request_buffering off;
      proxy_buffering off;
    }

    # ---- Subversion (WebDAV): Redmine アカウントで Basic 認証 ----
    location /svn {
      auth_request /_auth;
      error_page 401 = @unauthorized;

      set $up http://svn:80;
      proxy_pass $up;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      # バックエンドは送られたユーザー名を REMOTE_USER として受けるだけなので Authorization は通す
      proxy_set_header Authorization $http_authorization;
      proxy_request_buffering off;
      proxy_buffering off;
    }

    location @unauthorized {
      add_header WWW-Authenticate 'Basic realm="Redmine account"' always;
      return 401;
    }
  }
}
