name: gitlab-mcp-server

services:
  gitlab-mcp-server:
    build: .
    image: gitlab-mcp-server:local
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # ホスト全体には公開せず、127.0.0.1のみにバインドする
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
