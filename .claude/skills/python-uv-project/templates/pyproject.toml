[project]
name = "__PROJECT_NAME__"
version = "0.1.0"
description = "Pythonの練習用プロジェクト"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
# サプライチェーン攻撃対策: 公開されたばかりのパッケージバージョンは
# 悪意あるものが検知・撤回される猶予を確保するため、7日間はインストール対象から除外する
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# main.py はパッケージ化していないプロジェクト直下のモジュールなので、
# pytestのデフォルトのimportモードのままだとtestsディレクトリからは見えない。
# pythonpathでプロジェクトルートをsys.pathに加え、`from main import ...`を可能にする。
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = [
    ".venv/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
