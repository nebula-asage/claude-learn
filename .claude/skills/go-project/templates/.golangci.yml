version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocritic
  settings:
    revive:
      rules:
        - name: package-comments
        - name: exported

formatters:
  enable:
    - gofmt
    - goimports
